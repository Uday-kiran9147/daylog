name: daylog
description: Offline-first daily journal and time tracker
publish_to: none
version: 1.3.7+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # local db

  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.1

  # state management
  flutter_riverpod: ^2.4.9

  # utils
  share_plus: ^12.0.2
  file_picker: ^11.0.2

  purchases_flutter: ^10.11.0
  google_mobile_ads: ^9.1.0
  flutter_dotenv: ^6.0.1
  package_info_plus: ^8.3.0
  audioplayers: ^6.8.1

  # DayNote integration
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  google_fonts: ^6.2.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  isar_generator: ^3.1.0
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/daynote-icon_1024.png"
  adaptive_icon_background: "#F5EAD8"
  adaptive_icon_foreground: "assets/icon/daynote-adaptive-foreground.png"
flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.dev
    - .env.prod
    - assets/images/
    - assets/icon/
